name: Check Wispr Flow Version

# The Linux patches target one audited proprietary bundle. This manual check
# reports upstream drift but never bumps or tags an unported bundle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compare supported and latest versions
        run: |
          supported=$(sed -nE "s/^readonly APP_VERSION='([^']+)'/\1/p" build.sh)
          latest=$(scripts/setup/resolve-installer-url.sh \
            | sed -nE 's/^VERSION=//p')
          echo "supported=$supported"
          echo "latest=$latest"
          if [[ "$latest" != "$supported" ]]; then
            echo "::warning::Wispr Flow $latest needs an explicit Linux port"
          fi
